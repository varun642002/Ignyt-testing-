apply plugin: 'com.android.application'
apply plugin: 'kotlin-android' // ADDED for Health Connect plugin (Kotlin)

/* THE ONLY PLACE THE VERSION IS WRITTEN.
 *
 * versionCode used to be a counter maintained by hand next to versionName. It had reached 11
 * here while Play had already accepted 10 and 11 from builds this repo never recorded, so two
 * uploads were rejected in a row and nothing in the file could say which number was safe.
 *
 * Deriving the code from the name ends that: 1.0.41 is 10041, which clears every code this
 * project has ever used by three orders of magnitude, and bumping the name is now the whole
 * job — the code follows and can never drift from it or be forgotten.
 *
 * major * 10000 + minor * 100 + patch, so 1.0.41 -> 10041 and 1.1.0 -> 10100. Minor and patch
 * must stay under 100, which the assert enforces rather than leaving to be noticed later.
 * Play's ceiling is 2,100,000,000, which this reaches at version 210.
 *
 * One-way door: Play only ever accepts an increasing code, so once an upload succeeds this
 * cannot go back to the small numbers. That is the intent — it is what stops the collisions.
 */
ext.appVersionName = "1.0.43"

/* Added to every derived code. 1.0.42 derives to 10042; the release that first used this
 * scheme had to clear the codes Play had already taken, so it went out as 10500 — the value
 * the scheme would give version 1.5.
 *
 * It is an offset and not a one-off override because a floor would break the next release:
 * 1.0.43 derives to 10043, which is BELOW 10500, and Play only ever accepts an increasing
 * code. Adding a constant keeps every future name mapping to a code above this one —
 * 1.0.43 -> 10501, 1.1.0 -> 10558, 2.0.0 -> 20458 — so the property that made deriving worth
 * doing survives the jump.
 *
 * Never lower this. Raising it is safe.
 */
ext.appVersionCodeOffset = 458

ext.appVersionCode = {
    def parts = appVersionName.replaceAll(/[^0-9.].*$/, "").tokenize(".").collect { it.toInteger() }
    while (parts.size() < 3) parts << 0
    assert parts[1] < 100 && parts[2] < 100 : "minor and patch must stay under 100: ${appVersionName}"
    def code = parts[0] * 10000 + parts[1] * 100 + parts[2] + appVersionCodeOffset
    // 10500 shipped. Anything at or below it would be rejected as already used.
    assert code >= 10500 : "versionCode ${code} is not above the 10500 already published"
    code
}()

// ADDED for Play Store release signing. Reads real secrets from a local, gitignored
// android/keystore.properties file (see android/keystore.properties.example) -- never
// hardcoded here. If that file doesn't exist yet (e.g. a fresh checkout, or before the
// keystore has been created), releaseSigningConfigured stays false and the release
// buildType below falls back to no signingConfig, exactly like it did before this change,
// so nothing breaks for anyone who hasn't set up release signing yet.
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def releaseSigningConfigured = keystorePropertiesFile.exists()
if (releaseSigningConfigured) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.varun.ignyt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.varun.ignyt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(keystoreProperties['storeFile']) // resolved relative to android/app/, same dir as keystore.properties itself
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        // AGP 8 stopped generating BuildConfig by default. AuthPlugin needs BuildConfig.DEBUG
        // to withhold the signing fingerprints from release builds, and a build-type constant
        // is the only source of that fact the web layer cannot spoof.
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    // ADDED for Health Connect (requires Java 17+ bytecode target)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ADDED for Health Connect — official AndroidX SDK only, no third-party wrapper.
    // Check https://developer.android.com/jetpack/androidx/releases/health-connect for anything
    // newer before building; this was the current documented version at integration time.
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // IGNYT account: email/password via Firebase Authentication, and nothing else.
    // Phone (SMS) was removed because it could not send until Play Integrity succeeded, and it
    // asked a Play reviewer for a number they have no reason to give. Google Sign-In was tried
    // twice and removed twice — androidx.credentials, credentials-play-services-auth and
    // googleid went with it. A second identity provider means a second set of fingerprints,
    // OAuth clients and failure modes to keep working, and it did not sign anyone in.
    // Versions deliberately from the Kotlin 1.9-era compatibility set (this project pins
    // kotlin_version 1.9.24): newer Firebase releases ship Kotlin 2.x metadata the 1.9 compiler
    // can't read. Do not bump these without also revisiting kotlin_version in android/build.gradle.
    // The app builds and runs WITHOUT google-services.json (sign-in then reports "not
    // configured" cleanly); drop the file from Firebase Console into android/app/ to enable it.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-auth"
    /* Play Integrity is how Firebase Auth verifies this app is genuine before sending an SMS.
       firebase-auth pulls it transitively, but declaring it pins a current version and makes
       the dependency visible — when this verification fails, Firebase silently falls back to a
       reCAPTCHA WEB flow that opens <project>.firebaseapp.com in a browser. That fallback is
       the "why is phone login opening Chrome" symptom, and it is not something app code can
       turn off: the only real fix is making the primary path succeed (Play Integrity API
       enabled on the Cloud project + the signing SHA-256 registered in Firebase). */
    implementation "com.google.android.play:integrity:1.4.0"

    // Google Play Billing. Required, not chosen: a Play-distributed app selling access to
    // digital content must bill through Play. The 7-day free trial is configured as an offer
    // on the base plan in Play Console, so no trial logic ships in the app.
    implementation "com.android.billingclient:billing-ktx:7.1.1"
    // ADDED for Phase 2B cloud sync (profile/settings backup). Same BOM pins the version;
    // Firestore's built-in disk persistence provides the offline-first queueing.
    implementation "com.google.firebase:firebase-firestore"
    // Task.await() bridge used by AuthPlugin; same version line as coroutines-android above.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
