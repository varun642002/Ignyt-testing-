# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Gradle 8.14.3 cannot compile build/settings scripts on JDK 25 (JAVA_HOME on this machine) --
# confirmed by stopping the Gradle daemon and observing "Unsupported class file major version
# 69" on a fresh settings.gradle evaluation; a pre-existing environment incompatibility that
# earlier builds this session never hit only because a long-lived daemon kept reusing an
# already-compiled settings script. Pointing Gradle itself at Android Studio's bundled JDK 21
# (already present locally) fixes this without changing the project's own pinned Java/Kotlin
# target (still 21 everywhere, per CLAUDE.md) and without any network-based JDK download.
#
# THIS PATH IS A LOCAL DEFAULT, NOT A REQUIREMENT. It is an absolute path that exists only on a
# machine with Android Studio installed at that location, so a fresh checkout on a build server
# or another developer's machine fails immediately with a confusing error.
#
# It is not removed, because removing it breaks the build here: JAVA_HOME on this machine is
# Temurin 25, and Gradle on 25 dies with "Unsupported class file major version 69" before it
# compiles anything. A working absolute path beats a portable broken one.
#
# TO OVERRIDE WITHOUT EDITING THIS FILE: set org.gradle.java.home in your own
# ~/.gradle/gradle.properties. Gradle reads that file at HIGHER precedence than this one, so
# your value wins, and this line stays out of everyone's diffs. Any JDK 21 will do.
#
# The Java and Kotlin TARGETS are pinned separately in app/build.gradle and do not depend on
# which JDK runs Gradle.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
