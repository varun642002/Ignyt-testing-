<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- No maximum-scale. It was maximum-scale=1, which disables pinch-zoom on every screen — a
     WCAG 1.4.4 failure that leaves a low-vision user with no way to magnify anything. That
     attribute is normally added to stop iOS zooming when an input takes focus; the actual cure
     for that is a >=16px font-size on inputs, which this app already uses throughout. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#121216" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ignyt" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Ignyt</title>

<script>
/* =========================================================
   PLATFORM MARKER — data-platform="ios" | "android" | "web" on <html>.

   Set here, in <head>, because it has to exist before the first paint or a rule keyed off it
   would apply one frame late and the screen would visibly correct itself.

   WHY THIS EXISTS. Until now nothing in the app could tell the platforms apart in CSS, so
   every layout fix was necessarily a fix to both — which is fine while a difference is
   genuinely shared (safe-area insets are zero on a phone without a gesture bar, so the same
   rule is already a no-op on Android) and wrong the moment one platform needs something the
   other must not get.

   The rule is: prefer a solution that is correct on both. Reach for a data-platform selector
   only when the platforms genuinely disagree, and say in a comment why. A codebase where
   every rule is forked twice is two codebases wearing one name.

       html[data-platform="ios"]     .thing { ... }
       html[data-platform="android"] .thing { ... }

   Capacitor injects its runtime before this script on a device, so getPlatform() is available
   synchronously. The listener is for the case where it is not — the attribute is corrected
   before anything the user can see, and "web" is the honest default in a browser.
========================================================= */
(function () {
  function apply() {
    var p = "web";
    try {
      if (window.Capacitor && typeof window.Capacitor.getPlatform === "function") {
        p = window.Capacitor.getPlatform() || "web";
      }
    } catch (e) { /* a platform check must never be why the app fails to start */ }
    document.documentElement.setAttribute("data-platform", p);
  }
  apply();
  if (document.documentElement.getAttribute("data-platform") === "web") {
    document.addEventListener("DOMContentLoaded", apply, { once: true });
  }

  /* =========================================================
     SAFE-AREA REPAIR — only when env() lies.

     THE SYMPTOM. On an iPhone the header was drawn UNDER the status bar: the clock and the
     battery sat on top of the eyebrow and the header buttons. The CSS is not the cause — one
     rule owns that padding (css/layout.css) and it already asks for
     max(calc(var(--safe-top) + 8px), 20px). It came out at the 20px floor, which only happens
     if env(safe-area-inset-top) reported 0 on a device that plainly has a cut-out. The meta
     viewport carries viewport-fit=cover, so it should not have.

     WHY MEASURE RATHER THAN ASSUME. Hard-coding a value per platform would be wrong the day
     env() starts working, and wrong forever on the iPhones that report correctly. So the inset
     is READ from a probe element, and this only substitutes a value when the reading is 0 on a
     device whose screen is tall enough to have a notch or an island. If env() works, nothing
     here changes anything: --safe-top keeps its env() definition and the probe simply confirms
     it. The repair disables itself.

     THE HEIGHT TEST. Every notched iPhone is at least 812 CSS px tall (X, 11, 12 mini); every
     iPhone that genuinely has a 20px status bar is shorter (SE at 667, 8 Plus at 736). 54px is
     the Dynamic Island inset, the largest of the modern set — over-padding by a few px on an
     older notch is invisible, whereas under-padding puts the title back under the clock.
  ========================================================= */
  function repairSafeTop() {
    if (document.documentElement.getAttribute("data-platform") !== "ios") return;
    var probe = document.createElement("div");
    probe.style.cssText =
      "position:fixed;top:0;left:0;width:0;visibility:hidden;pointer-events:none;" +
      "padding-top:env(safe-area-inset-top,0px)";
    (document.body || document.documentElement).appendChild(probe);
    var measured = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    probe.remove();

    if (measured > 0) return;                       // env() works — leave it alone
    var tall = Math.max(screen.width, screen.height) >= 812;
    document.documentElement.style.setProperty("--safe-top", tall ? "54px" : "20px");
    document.documentElement.setAttribute("data-safe-top-repaired", tall ? "54" : "20");
  }
  if (document.body) repairSafeTop();
  else document.addEventListener("DOMContentLoaded", repairSafeTop, { once: true });
})();
</script>

<style>
/* =========================================================
   STYLES — CSS custom properties (dark + light theme), base resets,
   focus-visible accessibility outline, and the app shell (#app).
   Everything else is layered on top of these variables.
========================================================= */

:root{
    --bg:#121216; --surface:#1C1C22; --surface-alt:#26262E;
    --accent:#FF5A1F; --steel:#2563EB; --text:#F2F1ED; --muted:#8B8B94; --mint:#3ECF8E;
    --border:#33333d; --kb-inset:0px; --pin-height:0px;

    /* Clearance above the floating bottom nav: its own bottom offset (10px + safe area) plus
       its height, plus a gap. Anything that pins itself above the nav uses this rather than
       guessing, so one nav change moves them all. */
    --nav-float-clear: calc(86px + env(safe-area-inset-bottom,0px));

    /* PRIMARY vs ACCENT — the split the reference screens actually use.
       Look closely at them: the calorie ring is ORANGE while the buttons, links and active
       nav item are BLUE. They are not one colour used twice, they are two colours doing two
       jobs — accent marks DATA (energy, the ring, calorie figures), primary marks ACTION
       (the thing you tap).
       That is why this is not a palette swap. IGNYT's orange keeps every job it had; blue
       takes over the interactive elements it was doubling up on. */
    --primary:#2563EB; --primary-strong:#2563EB; --on-primary:#FFFFFF;
    --primary-soft:rgba(37,99,235,.14);
  }

/* Light theme.

     The ground is a cool grey rather than white so that white CARDS become the thing you
     look at. On a white-on-white page a card has to earn its edge with a border; on a grey
     ground it only needs a shadow, which is why this reads as calmer while using less ink.

     Text runs on four steps rather than two: headings, body, secondary, placeholder. The
     old palette had only --text and --muted, so body copy and headings shared a near-black
     and everything competed. --text is now the heading weight; --text-body carries running
     text; --muted is secondary. */
[data-theme="light"]{
    --bg:#F8FAFC; --surface:#FFFFFF; --surface-alt:#EFF3F8;
    --accent:#E24E15; --steel:#2563EB; --mint:#188F5D;
    --text:#111827; --text-body:#4B5563; --muted:#6B7280; --placeholder:#9CA3AF;
    --border:#E7EBF0; --divider:#E8ECF2;

    /* The reference blue, tuned for a light ground. Same split as the dark theme: this is
       action, --accent stays data. */
    --primary:#2563EB; --primary-strong:#2563EB; --on-primary:#FFFFFF;
    --primary-soft:rgba(37,99,235,.10);

    /* Soft and wide rather than dark and tight: 6-8% opacity, 24-32px blur, 6-10px drop.
       A heavy shadow on a light ground reads as dirt under the card instead of lift. */
    --shadow-sm: 0 1px 3px rgba(31,41,55,.05);
    --shadow-md: 0 6px 24px rgba(31,41,55,.07);
    --shadow-lg: 0 10px 32px rgba(31,41,55,.08);
    --shadow-card: var(--shadow-md);
  }

/* Placeholders are the lightest step in the scale — present enough to read as a hint,
   quiet enough never to be mistaken for a filled value. */
[data-theme="light"] ::placeholder{ color:var(--placeholder); opacity:1; }

[data-theme="light"] .timer-ring{ color:#16161A; }

[data-theme="light"] .week-chip.active{ color:#fff; }

[data-theme="light"] .level-chip.active{ color:var(--accent); }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--steel); outline-offset:2px; border-radius:4px;
  }

html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    height:100%; overscroll-behavior:none;}

#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
/* =========================================================
   COMPONENTS — every named UI component's styling: cards, buttons,
   set tables, exercise cards, the timer overlay, the exercise menu,
   the More sheet, chips, and every other reusable piece of the UI.
   This app is hand-built rather than utility-class-driven, so most
   of the styling genuinely lives here rather than in utilities.css.
========================================================= */

.del{color:#5c5c66; font-weight:700; font-size:12px; padding:9px; background:none; border:none; cursor:pointer;
    min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;}

/* header.app-header's padding is NOT here. css/layout.css owns it, loads after this block and
   wins at equal specificity, so a rule written here would look authoritative and do nothing —
   which is what the previous one did. See the comment there for why the top value is a max()
   rather than an addition. */

h1.title{font-weight:900; text-transform:uppercase; font-size:30px; letter-spacing:-0.02em; margin:0; line-height:1;}

/* The bottom is --main-pad-bottom (tokens.css), which is the ONE definition of nav clearance.
   It was a flat 100px here and base.css quietly overrode it with the safe-area-aware value —
   so this number was already dead, and reading it was how three page backgrounds ended up
   cancelling the wrong amount. Same value in both places now, so the shorthand no longer
   states something untrue. */
main{flex:1; overflow-y:auto; padding:0 16px var(--main-pad-bottom); -webkit-overflow-scrolling:touch;}

.week-rail{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -ms-overflow-style:none; scrollbar-width:none;}

.week-rail::-webkit-scrollbar{display:none;}

.week-chip{flex-shrink:0; width:44px; height:48px; border-radius:8px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:var(--surface-alt); color:var(--text);
    font-weight:900; font-size:14px; border:none; cursor:pointer;}

.week-chip.active{background:var(--accent); color:#151515; box-shadow:0 0 0 2px rgba(255,90,31,.35);}

.week-bar{margin-top:4px; height:2px; width:24px; border-radius:1px; overflow:hidden; background:rgba(0,0,0,.2);}

.week-chip.active .week-bar{background:rgba(0,0,0,.3);}

.week-bar-fill{display:block; height:100%; background:var(--steel);}

.week-chip.active .week-bar-fill{background:#151515;}

.phase-pill{font-size:11px; font-family:'SF Mono',monospace; font-weight:700; padding:2px 8px; border-radius:6px;
    background:var(--surface-alt); color:var(--steel);}

.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -ms-overflow-style:none; scrollbar-width:none;}

.day-tabs::-webkit-scrollbar{display:none;}

.day-tab{flex-shrink:0; padding:8px 12px; border-radius:10px; background:transparent; border:1px solid var(--border);
    text-align:left; cursor:pointer;}

.day-tab.active{background:var(--surface-alt); border-color:var(--steel);}

.day-tab .dtop{font-size:11px; font-family:'SF Mono',monospace; font-weight:700; color:var(--muted);}

.day-tab.active .dtop{color:var(--steel);}

.day-tab .dbot{font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap;}

.day-tab.active .dbot{color:var(--text);}

.ex-card{position:relative; border-radius:14px; overflow:hidden; display:flex; background:var(--surface); margin-bottom:10px;}

.ex-stripe{width:6px; flex-shrink:0;}

.ex-stripe.pending{background:repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, transparent 4px, transparent 8px);}

.ex-stripe.done{background:var(--mint);}

.ex-body{flex:1; display:flex; gap:12px; padding:14px; cursor:pointer; align-items:flex-start;}

.ex-check{margin-top:2px; width:20px; height:20px; border-radius:50%; flex-shrink:0; border:2px solid #4a4a54;
    display:flex; align-items:center; justify-content:center;}

.ex-check.done{background:var(--mint); border-color:var(--mint);}

.ex-name{font-weight:700; font-size:15px;}

.ex-name.done{color:var(--muted); text-decoration:line-through;}

.ex-presc{font-family:'SF Mono',monospace; font-size:13px; margin-top:2px; color:var(--steel);}

.ex-presc.done{color:#5c5c66;}

.ex-note{font-size:11px; font-style:italic; color:var(--muted); margin-top:4px;}

.ex-actions{display:flex; gap:6px; padding:0 14px 12px 32px;}

.ex-log-btn{font-size:11px; font-weight:700; padding:5px 10px; border-radius:6px; background:var(--surface-alt);
    color:var(--text); border:none; cursor:pointer;}

.btn{border:none; border-radius:10px; font-weight:700; cursor:pointer; padding:13px; font-size:16px;}

.btn-accent{background:var(--accent); color:#151515;}

.btn-steel{background:var(--steel); color:#0c1c24;}

.btn-ghost{background:var(--surface-alt); color:var(--text);}

.btn-block{width:100%;}

.btn:disabled{opacity:.3; pointer-events:none;}

input,select,textarea{font-family:inherit; background:transparent; color:var(--text); border:none; outline:none;}

.field{background:var(--surface); border-radius:10px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}

.field label{font-size:14px; font-weight:600;}

.field input[type=number], .field input[type=date], .field input[type=text]{
    font-family:'SF Mono',monospace; font-weight:700; text-align:right; width:100px; color:var(--accent); font-size:16px;}

.field .unit{font-size:11px; color:var(--muted); margin-left:4px;}

.stat-card{background:var(--surface-alt); border-radius:10px; padding:12px 14px;}

.stat-label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}

.stat-value{font-family:'SF Mono',monospace; font-weight:900; font-size:24px; margin-top:2px;}

.stat-unit{font-size:13px; font-weight:600; color:var(--muted); margin-left:4px;}

.info-box{background:var(--surface); border-radius:10px; padding:14px; font-size:14px; line-height:1.5; color:var(--muted);}

.search-bar{background:var(--surface); border-radius:10px; padding:10px 14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}

.search-bar input{background:none; border:none; outline:none; color:var(--text); font-size:16px; width:100%;}

.ex-picker-textbtn{background:none; border:none; color:var(--muted); font-size:15px; font-weight:600; cursor:pointer; padding:4px;}

.ex-picker-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer;}

.ex-picker-row:active{background:var(--surface-alt);}

.ex-picker-avatar{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:16px; flex-shrink:0;}

/* The exercise illustration, in place of the letter avatar. Same 44px footprint so a row with
   artwork and one without line up. Square-with-rounded-corners rather than a circle: these are
   wide drawings and a circular mask clips the equipment off both sides. White tile and
   object-fit:contain for the same reason as everywhere else they appear. */
.ex-picker-photo{width:44px; height:44px; border-radius:10px; overflow:hidden; flex-shrink:0;
    background:#fff; display:block;}
.ex-picker-photo img{width:100%; height:100%; object-fit:contain; display:block;}

/* Multi-select. The tick takes the illustration's place rather than sitting beside it: at 44px
   the row has no spare width, and swapping the whole thumbnail makes the selected state
   readable while scrolling a long list. */
.ex-picker-tick{width:44px; height:44px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--color-interactive, #2563eb); color:#fff;}
.ex-picker-row.is-picked{background:rgba(37,99,235,.06);}

/* Commit bar. FIXED to the viewport, not sticky.
   It was `position:sticky; bottom:0`, which does nothing here: a sticky element only travels
   inside its own containing block, and this bar is the LAST child of the picker — the parent
   ends exactly where the bar does, so there is no room for it to stick to. With 452 exercises
   the results list is ~29,000px tall, which put "Add 3 exercises" 28,800px below the fold.
   You could select exercises and there was no way to commit them without scrolling the entire
   library. Reported as "there is no option to add everything".

   z-index above the bottom nav's 40 so the floating pill cannot cover it, and matched to the
   app shell's 480px column so it lines up with the content rather than the phone. */
.ex-picker-bar{position:fixed; left:50%; transform:translateX(-50%);
    /* ABOVE the nav, not over it. At bottom:0 this overlapped the floating nav pill by 63px
       and simply covered it -- the bar won on z-index, so the tab bar vanished behind it
       while picking. --nav-float-clear is the pill's own offset plus its height, so the two
       stay clear of each other without this hardcoding a number that a nav restyle breaks. */
    bottom:var(--nav-float-clear); width:calc(100% - 24px); max-width:456px; z-index:60;
    display:flex; gap:10px; align-items:center;
    padding:10px 12px; border-radius:18px;
    background:var(--surface, #fff); border:1px solid var(--border);
    box-shadow:0 8px 30px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);}
/* THE AI BUTTON. Round, floating, bottom-right, above the nav pill.

   Positioned off the app's own 480px column rather than the viewport edge: `left:50%` with a
   translate puts its right edge where the content's right edge is, so on a tablet it sits
   beside the app instead of stranded in the far corner. Same trick the nav pill uses.

   --nav-float-clear is the pill's own offset plus its height -- the same token .ex-picker-bar
   above uses, so a nav restyle moves both and neither needs a number updating by hand.

   z-index 45: above the nav's 40 so the pill cannot clip it, below the picker bar's 60 so it
   never covers a commit action. */
.ai-fab{position:fixed; z-index:45;
    bottom:var(--nav-float-clear);
    left:50%; transform:translateX(calc(240px - 100% - 12px));
    width:56px; height:56px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    border:none; padding:0; cursor:pointer;
    /* --primary, NOT --accent. --accent is the orange (#FF5A1F); --primary is the one blue the
       app was consolidated onto (#2563EB). Reaching for the token whose name sounds right is
       how a second accent colour gets reintroduced one component at a time. */
    background:var(--primary, #2563EB); color:#fff;
    /* Two shadows: a wide soft one for the lift, a tight one so the edge stays defined against
       a light background. Warmer than the nav's because this sits ON the page, not over it. */
    box-shadow:0 8px 24px rgba(37,99,235,.38), 0 2px 6px rgba(0,0,0,.20);
    transition:transform .18s ease, opacity .18s ease;}

/* The column is 480px wide and centred, so its right edge is 240px right of centre. */
@media (min-width:480px){ .ai-fab{transform:translateX(calc(240px - 100% - 12px));} }
@media (max-width:479px){ .ai-fab{left:auto; right:16px; transform:none;} }

.ai-fab:active{transform:translateX(calc(240px - 100% - 12px)) scale(.94);}
@media (max-width:479px){ .ai-fab:active{transform:scale(.94);} }

/* Hidden on the AI screen itself -- a button whose only job is "go to AI" is noise once you
   are there, and it would sit on top of the message input. */
.ai-fab.is-hidden{opacity:0; pointer-events:none; transform:translateX(calc(240px - 100% - 12px)) scale(.8);}
@media (max-width:479px){ .ai-fab.is-hidden{transform:scale(.8);} }

/* Follows the nav out of the way when the keyboard is up, for the same reason: at 56px it
   would otherwise float over the top of the editing area. */
body.kb-open .ai-fab{opacity:0; pointer-events:none;}

@media (prefers-reduced-motion:reduce){ .ai-fab{transition:none;} }

/* Room for the bar AND the nav below it, so the last exercises are not stuck underneath. */
.ex-picker-bar-spacer{height:170px;}
.ex-picker-bar__clear{background:none; border:none; cursor:pointer; padding:12px 14px;
    font-size:14px; font-weight:700; color:var(--muted); font-family:inherit;}
.ex-picker-bar__add{flex:1; border:none; cursor:pointer; padding:14px 16px; border-radius:12px;
    background:var(--color-interactive, #2563eb); color:#fff;
    font-size:15px; font-weight:800; font-family:inherit;}

.ex-picker-info{background:none; border:none; color:var(--muted); padding:8px; flex-shrink:0; cursor:pointer;}

.search-bar input{flex:1; font-size:16px; color:var(--text);}

.cat-chip{display:inline-block; padding:8px 14px; border-radius:20px; font-size:14px; font-weight:700; margin:0 6px 6px 0;
    background:var(--surface-alt); color:var(--muted); border:none; cursor:pointer;}

.cat-chip.active{background:var(--steel); color:#0c1c24;}

.lib-item{background:var(--surface); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}

.ex-anim-wrap{width:100%; aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:#000; margin-top:12px;}

.ex-anim-video{width:100%; height:100%; object-fit:cover; display:block;}

.ex-anim-fallback{width:100%; aspect-ratio:4/3; border-radius:14px; background:var(--surface-alt); margin-top:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); overflow:hidden;}

.lib-item-name{font-weight:700; font-size:14px;}

.lib-item-cat{font-size:11px; color:var(--muted); font-family:'SF Mono',monospace; margin-top:2px;}

.lib-add-btn{font-size:18px; color:var(--accent); font-weight:900; padding:0 6px;}

.timer-overlay{position:fixed; inset:0; background:rgba(10,10,12,.94); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; z-index:50; flex-direction:column; gap:18px;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px)); overflow-y:auto;
    animation:timer-overlay-in .28s cubic-bezier(.2,.8,.2,1);}
@keyframes timer-overlay-in{ from{ opacity:0; } to{ opacity:1; } }
@media (prefers-reduced-motion: reduce){ .timer-overlay{ animation:none; } }

.timer-ring{font-family:'SF Mono',monospace; font-weight:900; font-size:clamp(52px,15vw,86px); color:var(--accent);
    line-height:1; letter-spacing:-.01em; transition:color .2s ease;}
.timer-ring--countdown{ color:#fff; animation:timer-pulse .5s ease infinite; }
@keyframes timer-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

.timer-label{font-size:13px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); font-weight:700;}

/* ---------- Header: exercise context above the ring (Bug Fix #4) ---------- */
.timer-header{ display:flex; flex-direction:column; align-items:center; gap:10px; max-width:340px; text-align:center; }
.timer-header__thumb{ width:72px; height:72px; border-radius:18px; overflow:hidden; background:var(--surface); flex:none; }
.timer-header__thumb img, .timer-header__thumb video{ width:100%; height:100%; object-fit:cover; }
.timer-header__name{ font-size:19px; font-weight:800; color:var(--text); }
.timer-header__meta{ font-size:12px; color:var(--muted); font-weight:600; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

/* ---------- Progress ring (Bug Fix #6) -- conic-gradient, same technique already used by
   .wk-ring/.pg-ring elsewhere in the app, kept visually consistent with those. Updated on
   every tick via a --pct custom property (app.js writes it directly, no full re-render, so

/* THE BOTTOM BAR IS A FLOATING PILL, not a docked strip.
   It sits inset from all three edges with a full-round radius, so the page scrolls visibly
   underneath it rather than stopping at a hard border. `bottom` carries the safe-area inset,
   which is what keeps it clear of the home indicator without padding the bar itself taller.
   The old version was flush to the bottom, square, and separated by a 1px border-top. */
nav.bottom-nav{position:fixed; left:50%; transform:translateX(-50%);
    /* max, not a sum. Adding the full inset to the base margin put the pill 44px off the bottom
       on a home-indicator iPhone while it sits only 12px in from the sides -- nearly four times
       the side margin, which reads as a bar floating too high rather than one inset evenly.
       The inset already includes the clearance the home indicator needs, so taking whichever is
       larger keeps that clearance on iPhone and the 10px base everywhere else. */
    bottom:max(10px, env(safe-area-inset-bottom,0px));
    width:calc(100% - 24px); max-width:456px;
    display:flex; padding:6px; gap:0;
    background:rgba(23,23,28,.86); backdrop-filter:blur(9px) saturate(115%); -webkit-backdrop-filter:blur(9px) saturate(115%);
    border:1px solid rgba(255,255,255,.06); border-radius:999px; z-index:40;
    /* Lighter than it was. A 30px black glow at 35% under a bar that is now 7% opaque is not a
       shadow any more, it is the darkest thing about the bar — it was reading as a solid band
       and defeating the transparency above it. A shadow has to be proportional to the surface
       casting it; a near-transparent pill casts almost nothing. */
    box-shadow:0 6px 18px rgba(0,0,0,.20), 0 1px 3px rgba(0,0,0,.12);
    transition:transform .18s ease;}

/* Keyboard-aware layout: body.kb-open is toggled by the visualViewport listener in app.js
   whenever the on-screen keyboard is up. Slides the fixed bottom nav out of the way instead of
   letting it float on top of the keyboard/editing area -- covers browser/PWA mode, where the
   layout viewport doesn't shrink the way the native WebView does under adjustResize. */
body.kb-open nav.bottom-nav{transform:translate(-50%, 100%);}

/* min-width:0 matters now that the bar carries six items rather than five: without it a
   flex item refuses to shrink below its content, so "Food Log" would push the row wider than
   the screen instead of the labels ellipsing. */
.nav-btn{flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 1px; border-radius:999px; background:none; border:none; color:var(--muted);
    cursor:pointer; transition:color .16s ease, background-color .16s ease;}
.nav-btn span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* The selected tab carries its own pill inside the bar. That highlight is what makes this read
   as a segmented control rather than a row of icons -- colour alone did the job before, and at
   a glance a coloured icon among grey ones is easy to miss.

   The pill is now ONE element that slides (.nav-ind) rather than a background on whichever
   button happens to be active. A background cannot travel between two elements; it can only
   appear on one and vanish from the other, which is what the bar used to do. */
.nav-btn.active{color:var(--accent); background:none;}

/* gap is 0 on the bar so each button is exactly 1/5 of the track and the indicator can be
   positioned with a plain percentage translate -- no measuring, no resize listener, and it
   stays correct through rotation and split screen. */
/* THE SLIDING LENS. A flat 10%-white pill before, which read as a smudge once the bar itself
   went transparent — there was nothing left for it to contrast against. It is a piece of glass
   now: it takes what is behind it, blurs and brightens it, and carries a chromatic rim.

   Four layers make glass read as glass, and it needs all four:
     backdrop-filter   the refraction. blur so the content beneath softens, saturate+brightness
                       so it looks lit from inside rather than fogged.
     inset highlight   a bright top edge and a dimmer bottom one — the two edges every real
                       lens has, and the cheapest cue that something is raised.
     drop shadow       small and tight, so the lens sits ON the bar rather than floating.
     chromatic rim     ::before, below. A lens splits light at its edge; without that the shape
                       is just a lighter oval.

   backdrop-filter is affordable HERE where it was not on the bar: this is one small element
   that moves on the compositor, not a full-width surface over a scrolling list. */
.nav-ind{position:absolute; top:5px; bottom:5px; left:6px; z-index:0;
    width:calc((100% - 12px) / var(--nav-count, 5));
    border-radius:999px;
    background:rgba(255,255,255,.13);
    backdrop-filter:blur(3px) saturate(190%) brightness(1.18);
    -webkit-backdrop-filter:blur(3px) saturate(190%) brightness(1.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.14),
               0 2px 8px rgba(0,0,0,.28);
    transform:translateX(calc(var(--nav-i, 0) * 100%));
    opacity:0; pointer-events:none;
    /* Apple's own tab curve: a hard front-load then a long settle, so it reads as fast while
       still arriving softly. Opacity is quicker than travel -- a pill that fades as slowly as
       it moves looks like it is being dragged. */
    transition:transform .38s cubic-bezier(.32,.72,0,1), opacity .2s ease;}
nav.bottom-nav.has-active .nav-ind{opacity:1;}

/* The chromatic rim. A gradient BORDER, which CSS has no property for — the two masks below
   punch the middle out of a filled box and leave a 1px ring of the gradient, so the colour sits
   only on the edge and never washes over the icon under it.
   Low alphas on purpose: a lens edge catches colour, it is not a rainbow. */
.nav-ind::before{content:""; position:absolute; inset:-1px; border-radius:inherit;
    padding:1.2px; pointer-events:none;
    background:conic-gradient(from 200deg,
        rgba(255,88,132,.55), rgba(255,206,84,.45), rgba(84,255,205,.45),
        rgba(37,99,235,.55), rgba(255,88,132,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;}
/* While a finger is on the bar the pill is being repositioned every frame, so a transition
   would only hold it behind the finger by its own duration. Off for the gesture, back on for
   the settle when the finger lifts — which is what makes the release feel like it lands. */
nav.bottom-nav.is-dragging .nav-ind{transition:none;
    /* Promoted to its own layer for the duration of the gesture, so each frame's move is a
       compositor transform rather than a repaint of the pill against the blurred bar behind
       it. Only while dragging: a layer that exists permanently costs memory for nothing. */
    will-change:transform;}

/* The icon and label under the pill still ease as it passes — but on a shorter curve than
   the settled one, so a quick sweep isn't trailed by five icons still finishing their grow.
   Killing the transition outright here was worse: passing over a tab snapped instead of
   blooming, which reads as a glitch rather than a response. */
nav.bottom-nav.is-dragging .nav-btn svg,
nav.bottom-nav.is-dragging .nav-btn span{transition:transform .18s cubic-bezier(.32,.72,0,1);}

/* touch-action tells the browser we handle horizontal movement here, so dragging along the
   bar does not also try to scroll the page behind it. `pan-y` keeps a vertical swipe that
   starts on the nav scrolling the page, which is what a user expects. */
nav.bottom-nav{touch-action:pan-y;}
/* The buttons must not swallow the pointer stream mid-drag. */
nav.bottom-nav .nav-btn{touch-action:none;}
/* The buttons sit above the pill; without this the indicator would cover the icons. */
.nav-btn{position:relative; z-index:1;}

/* The label and icon lift very slightly into the selected state -- it is the difference
   between the pill sliding onto a static row and the whole tab responding. */
.nav-btn svg, .nav-btn span{transition:transform .38s cubic-bezier(.32,.72,0,1);}
.nav-btn.active svg{transform:translateY(-1px) scale(1.06);}


/* The .is-dragging rules above are more specific than a bare `.nav-btn svg`, and specificity
   beats source order — so this block has to restate them at equal weight or reduced motion
   would be honoured everywhere EXCEPT during the gesture, which is the one place motion is
   most pronounced. */
@media (prefers-reduced-motion: reduce){
  .nav-ind, .nav-btn svg, .nav-btn span{transition:none;}
  nav.bottom-nav.is-dragging .nav-ind,
  nav.bottom-nav.is-dragging .nav-btn svg,
  nav.bottom-nav.is-dragging .nav-btn span{transition:none;}
}

<!-- AUTH LOADS BEFORE app.js, AND MUST KEEP DOING SO.
     app.js calls render() at its top level, and render()'s first act is to ask isSignedIn().
     With auth.js below app.js, window.IgnytAuth did not exist yet at that moment, so a
     returning user with a valid cached account was told they were signed out and shown the
     Sign In screen on every cold launch. On Android refreshFromNative() repaired it a moment
     later, making it a login-screen flash; when that native call failed it never repaired at
     all and the account was unreachable until a force-quit.
     Neither file touches `state` or render() during evaluation — auth.js's own boot() waits
     for DOMContentLoaded and notifyUI() checks both exist — so loading them first is safe. -->
<!-- Security layer first: the auth and sync modules below log security events, and a
     logEvent() call that lands before IgnytSecurity exists is a silently dropped event. -->
<script defer src="js/security/security.js"></script>
<script defer src="js/auth/firebase-rest-auth.js"></script>
<!-- After firebase-rest-auth.js, which it takes the ID token from; before cloud-sync.js,
