# Codemagic CI — builds IGNYT's iOS app on cloud Macs.
#
# WHY THIS EXISTS
# There is no Mac in this project. Android is built locally on Windows; iOS cannot be, and an
# iPhone is a test device, not a build machine. These workflows are the whole iOS toolchain.
#
# TWO WORKFLOWS, AND THE ORDER MATTERS
#
#   ios-compile-check   No signing, no Apple account, no money. Compiles the Swift and hands
#                       back the errors. Run this FIRST and keep running it until it passes.
#                       The HealthKit plugin was written without a compiler, so it will fail
#                       the first few times; this is the loop that fixes it, and it costs
#                       nothing but free-tier minutes.
#
#   ios-testflight      Signed build published to TestFlight, so it can be installed on a
#                       phone. Needs the $99/year Apple Developer Program and a Codemagic
#                       integration. Only worth setting up once the compile check is green —
#                       paying Apple to discover a syntax error would be a poor trade.
#
# Builds are NOT triggered automatically. The free tier is 500 minutes a month and an iOS
# build takes 10–20 of them, so a push-triggered build would burn the month on commits that
# never touched iOS. Start them from the Codemagic UI. To change that, add a `triggering:`
# block to a workflow.

workflows:

  # ---------------------------------------------------------------------------------------
  ios-compile-check:
    name: iOS compile check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync the web layer into the iOS project
        # Required, not optional. ios/App/App/public is gitignored — it is generated — so
        # without this the app builds and launches to a blank screen. This also resolves the
        # Swift package that Package.swift points at inside node_modules, which is why it has
        # to run after npm ci rather than before.
        script: npx cap sync ios

      - name: Show what will be built
        script: |
          echo "Swift sources in the target:"
          grep -o '[A-Za-z]*\.swift in Sources' ios/App/App.xcodeproj/project.pbxproj | sort -u
          echo "Web files synced: $(find ios/App/App/public -type f | wc -l)"

      - name: Compile for the simulator, unsigned
        # CODE_SIGNING_ALLOWED=NO is what removes the need for an Apple account. The
        # entitlements file is ignored when nothing is being signed, so the HealthKit
        # capability does not have to be registered yet for this to compile.
        script: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcode-build.log
    artifacts:
      # Kept whether the build passes or fails — on a failure this log IS the deliverable.
      - /tmp/xcode-build.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - varun642002@gmail.com
        notify:
          success: false      # a green compile needs no email; only failures are news
          failure: true

  # ---------------------------------------------------------------------------------------
  ios-testflight:
    name: iOS release to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # NO `integrations:` BLOCK. A named App Store Connect integration is a TEAM feature, and
    # this account is on an individual plan — referencing one failed with "App Store Connect
    # integration ignyt-app-store-connect does not exist", which was accurate.
    #
    # The API key is supplied as environment variables instead. This is not a workaround: the
    # codemagic-cli-tools read these three names directly, so it is the same key reaching the
    # same code by a route that does not depend on the plan.
    environment:
      groups:
        # Codemagic > your app > Environment variables. Every variable added there belongs to
        # a GROUP, and a group is not visible to a workflow until it is named here — that is
        # the whole purpose of this block. Create ONE group with exactly this name holding all
        # four variables below.
        #
        #   APP_APPLE_ID                     6798095139  (App Store Connect > App Information)
        #   APP_STORE_CONNECT_ISSUER_ID      secure
        #   APP_STORE_CONNECT_KEY_IDENTIFIER secure
        #   APP_STORE_CONNECT_PRIVATE_KEY    secure — the whole .p8 file, BEGIN/END lines and all
        #   CERTIFICATE_PRIVATE_KEY          secure — a 2048-bit RSA key you generate yourself:
        #                                      ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -N ""
        #                                    Keep it. It is what the distribution certificate
        #                                    belongs to, and losing it means burning another of
        #                                    Apple's three certificate slots.
        #
        # The three APP_STORE_CONNECT_* names are not arbitrary and must not be renamed: the
        # CLI looks for exactly these, which is why the signing step below passes no
        # credentials of its own and why no key material appears anywhere in this file.
        #
        # A separate bug lived here: APP_APPLE_ID used to be declared as `APP_APPLE_ID:
        # $APP_APPLE_ID`, a self-reference. With no group included there was nothing for the
        # right-hand side to resolve to, so it expanded to empty and then overwrote itself
        # with that emptiness. Adding the variable in the UI would not have helped; it would
        # have been set and then shadowed, which is worse than simply being absent, because
        # the UI shows it present.
        - ignyt
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync the web layer into the iOS project
        script: npx cap sync ios

      - name: Create the signing certificate and provisioning profile
        # THIS REPLACED THE DECLARATIVE `ios_signing:` BLOCK, which failed four times with
        # "No matching profiles found for bundle identifier com.varun.ignyt and distribution
        # type app_store" — and kept failing after the App ID was registered, HealthKit was
        # enabled on it, and the app record existed in App Store Connect. The message is
        # accurate and was never the problem it sounds like: there genuinely was no profile,
        # because nothing had created one. The shorthand FETCHES signing files; it does not
        # create them, and a first-ever build has nothing to fetch.
        #
        # `--create` is the whole fix. It makes the distribution certificate if the account
        # has none and the provisioning profile if the App ID has none, then keychain
        # add-certificates installs the certificate so xcodebuild can actually use it, and
        # use-profiles writes the profile into the Xcode project's build settings.
        #
        # No key material is handled here. The three variables below are set in the Codemagic
        # UI and the CLI reads them from the environment on its own.
        #
        # THE PRE-FLIGHT CHECK IS NOT DECORATION. app-store-connect is a Python CLI, so when
        # its credentials are absent it does not report a credentials problem — argparse
        # rejects the call as malformed and the step dies with a bare "exited with status code
        # 2". That is indistinguishable from a genuine syntax error in the command, and it is
        # exactly what happened here. Naming the missing variable turns a dead end into an
        # instruction.
        #
        # Lengths and a shape check, never values. A private key pasted without its BEGIN/END
        # armour, or with the newlines flattened, is the single most common way this fails,
        # and both survive a "the variable is set" check while still being unusable.
        #
        # One cost worth knowing: the declarative block failed during initialisation, which is
        # free. These are build steps, so from here a failure burns minutes.
        script: |
          set -e

          missing=""
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then missing="$missing APP_STORE_CONNECT_ISSUER_ID"; fi
          if [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then missing="$missing APP_STORE_CONNECT_KEY_IDENTIFIER"; fi
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"; fi
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then missing="$missing CERTIFICATE_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "Not set:$missing"
            echo ""
            echo "Add them in Codemagic > your app > Environment variables, in a group named"
            echo "exactly 'ignyt' (the name under environment.groups in codemagic.yaml). A"
            echo "variable in no group, or in a group this workflow does not name, is invisible"
            echo "to the build however correct it looks in the UI."
            echo "Generate the key at App Store Connect > Users and Access > Integrations,"
            echo "with App Manager access."
            exit 1
          fi

          echo "Issuer ID: ${#APP_STORE_CONNECT_ISSUER_ID} chars"
          echo "Key ID:    ${#APP_STORE_CONNECT_KEY_IDENTIFIER} chars"
          echo "Private key: ${#APP_STORE_CONNECT_PRIVATE_KEY} chars"
          case "$APP_STORE_CONNECT_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) echo "Private key: PEM armour present" ;;
            *) echo "Private key: NO 'BEGIN PRIVATE KEY' line found — paste the whole .p8 file, header and footer included"; exit 1 ;;
          esac

          keychain initialize

          # --certificate-key is what "Cannot save Signing Certificates without certificate
          # private key" was asking for, and it is NOT the App Store Connect key despite the
          # names being nearly identical.
          #
          #   APP_STORE_CONNECT_PRIVATE_KEY  proves who you are TO Apple. Apple issues it.
          #   CERTIFICATE_PRIVATE_KEY        is the key the distribution certificate BELONGS
          #                                  to. Apple never sees it and never generates it —
          #                                  a certificate is Apple's signature over a public
          #                                  key that you hold the other half of, so `--create`
          #                                  cannot invent one on your behalf.
          #
          # On a Mac, Keychain silently makes this key when you tick a box in Xcode, which is
          # why the step has no obvious counterpart and why the error reads like a bug.
          #
          # It MUST be stable across builds. Generating one per build would look like it works
          # and would mint a fresh distribution certificate every time; Apple allows three,
          # after which every build fails and the fix is a cleanup in the developer portal.
          app-store-connect fetch-signing-files "com.varun.ignyt" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Keep the build number ahead of TestFlight
        # TestFlight rejects a build number it has already seen, the same rule that made
        # Android's versionCode collide repeatedly. Asking App Store Connect for the current
        # highest and adding one removes the guesswork entirely; the marketing version still
        # comes from MARKETING_VERSION in the project file.
        #
        # A missing APP_APPLE_ID stops the build instead of falling through to 1. The two
        # cases look identical to the old `|| echo 0` and are not remotely the same: "no
        # builds yet" genuinely means 1, while "the variable is unset" means every build is
        # numbered 1 forever and the second upload is rejected. Guessing between them is how
        # the Android version numbering went wrong three times.
        script: |
          set -e
          if [ -z "$APP_APPLE_ID" ]; then
            echo "APP_APPLE_ID is not set."
            echo "Add it in Codemagic > Environment variables, in a group named 'ignyt'"
            echo "(the group name must match the one under environment.groups in this file,"
            echo "or the variable is invisible to the build no matter what the UI shows)."
            echo "Find the value at App Store Connect > your app > App Information > Apple ID."
            exit 1
          fi
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" || echo "")
          if [ -z "$LATEST" ]; then
            echo "No existing TestFlight build found — treating this as the first upload."
            LATEST=0
          fi
          echo "Latest on TestFlight: $LATEST -> building $(($LATEST + 1))"
          agvtool new-version -all $(($LATEST + 1))
        working_directory: ios/App

      - name: Build the signed archive
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release 2>&1 | tee /tmp/xcode-archive.log
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode-archive.log
    publishing:
      app_store_connect:
        # Explicit key rather than `auth: integration`, for the same reason as above: the
        # integration form requires a team. Same key, same variables the signing step uses.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Not submitted for App Store review automatically. Review is a one-way door and
        # health apps get extra scrutiny over HealthKit usage — that submission should be a
        # deliberate act in the Console, not a side effect of a green build.
        submit_to_app_store: false
      email:
        recipients:
          - varun642002@gmail.com
        notify:
          success: true
          failure: true
