name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same ref — a push mid-build makes the earlier
# run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Canonical URLs and Open Graph tags need a fixed origin at build time.
      NEXT_PUBLIC_SITE_URL: https://ignytfit.in
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check generated SEO routes
        run: |
          test -s .next/server/app/sitemap.xml.body || \
            (echo "sitemap.xml was not generated" && exit 1)
          test -s .next/server/app/robots.txt.body || \
            (echo "robots.txt was not generated" && exit 1)
